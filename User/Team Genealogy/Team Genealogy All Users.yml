info:
  name: Team Genealogy All Users
  type: http
  seq: 2

http:
  method: GET
  url: "{{LOCAL_USER_URL}}team-genealogy/read?limit=0"
  headers:
    - name: Authorization
      value: "{{USER_TOKEN}}"
  params:
    - name: limit
      value: "0"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
