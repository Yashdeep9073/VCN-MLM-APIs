info:
  name: Get User Placement Preference
  type: http
  seq: 1

http:
  method: GET
  url: "{{SERVER_USER_URL}}placement-preference/read"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
