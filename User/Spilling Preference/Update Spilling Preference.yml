info:
  name: Update Spilling Preference
  type: http
  seq: 2

http:
  method: PUT
  url: "{{LOCAL_USER_URL}}spilling-preference/update"
  headers:
    - name: Authorization
      value: "{{USER_TOKEN}}"
  body:
    type: json
    data: "{\r

      \    \"preference\":\"AUTO_BALANCE\"\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
