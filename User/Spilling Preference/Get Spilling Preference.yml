info:
  name: Get Spilling Preference
  type: http
  seq: 1

http:
  method: GET
  url: "{{LOCAL_USER_URL}}spilling-preference/read"
  headers:
    - name: Authorization
      value: "{{USER_TOKEN}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
