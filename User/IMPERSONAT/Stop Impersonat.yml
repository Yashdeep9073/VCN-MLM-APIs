info:
  name: Stop Impersonat
  type: http
  seq: 1

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}impersonate/stop"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "sessionId":1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
