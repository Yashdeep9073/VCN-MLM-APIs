info:
  name: Create Referral Link
  type: http
  seq: 1

http:
  method: POST
  url: "{{LOCAL_USER_URL}}referral/create"
  headers:
    - name: Authorization
      value: "{{USER_TOKEN}}"
  body:
    type: json
    data: |-
      {
        "isPrimary":false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
