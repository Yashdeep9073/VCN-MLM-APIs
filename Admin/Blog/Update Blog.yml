info:
  name: "Update Blog "
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{LOCAL_ADMIN_URL}}blog/update"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "id":1,
        "title": "Updated Omega 3 Benefits",
        "slug": "updated-omega-3-benefits",
        "excerpt": "Updated excerpt",
        "status": "PUBLISHED",
        "seoTitle": "Updated SEO title",
        "seoDescription": "Updated SEO description",
        "isActive": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
