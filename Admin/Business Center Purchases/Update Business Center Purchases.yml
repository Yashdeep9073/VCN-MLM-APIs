info:
  name: Update Business Center Purchases
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{LOCAL_ADMIN_URL}}business-centre-purchase/update"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "id": 1,
        "amount": 35000
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
