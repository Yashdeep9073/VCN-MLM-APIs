info:
  name: Create Business Center Purchases
  type: http
  seq: 3

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}business-centre-purchase/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "userId": 1,
        "businessCentreId": 1,
        "amount": 25000,
        "status": "DRAFT",
        "purchaseDate": "2026-08-06T10:30:00.000Z"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
