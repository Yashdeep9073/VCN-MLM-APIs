info:
  name: Update User Panel Permissions
  type: http
  seq: 2

http:
  method: PUT
  url: "{{LOCAL_ADMIN_URL}}user-panel-permissions/update"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "membershipType": [
          "CUSTOMER"
        ],
        "permissions": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
