info:
  name: Update User's Placement Preference
  type: http
  seq: 3

http:
  method: PUT
  url: "{{LOCAL_ADMIN_URL}}placement-preference/update"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: "{\r

      \    \"userId\": 18,\r

      \    \"placementPreference\": \"LEFT\"\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
