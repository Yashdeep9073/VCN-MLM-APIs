info:
  name: All Products
  type: http
  seq: 1

http:
  method: GET
  url: "{{LOCAL_ADMIN_URL}}products/read?page=1&limit=1"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "1"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
