info:
  name: Update Compensation Setting
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{LOCAL_ADMIN_URL}}compensation-setting/update"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: "{\r

      \    \"pairUnitBV\": 50,\r

      \    \"pairIncome\": 900,\r

      \    \"weeklyPairCap\": 100,\r

      \    \"bvConversionRate\": 9,\r

      \    \"rpPerPair\": 1,\r

      \    \"leftRequirement\": 1,\r

      \    \"rightRequirement\": 1,\r

      \    \"carryForward\": true,\r

      \     \"binaryMode\": \"STRICT\",\r

      \  \"allowSelfPairing\": true\r

      \  \r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
