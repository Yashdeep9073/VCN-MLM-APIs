info:
  name: Update Expenses
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{LOCAL_ADMIN_URL}}expense/update"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "id": 1,
        "status": "APPROVED"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
