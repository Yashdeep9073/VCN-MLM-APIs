info:
  name: "Create Expenses "
  type: http
  seq: 3

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}expense/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "title": "Office Rent - July 2026",
        "description": "Monthly office rent payment for Chandigarh branch.",
        "amount": 50000,
        "expenseDate": "2026-07-13T10:30:00.000Z",
        "categoryId": 1
      //   "receiptId": 12
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
