info:
  name: Update Club Rule
  type: http
  seq: 4

http:
  method: PUT
  url: "{{LOCAL_ADMIN_URL}}club-rules/update/2"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "operator": "GREATER_THAN",
        "targetValue": 7500
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
