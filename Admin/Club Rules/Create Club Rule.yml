info:
  name: "Create Club Rule "
  type: http
  seq: 3

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}club-rules/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "clubId": 2,
        "ruleType": "BV",
        "operator": "GREATER_THAN_EQUAL",
        "targetValue": 5000
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
