info:
  name: Update Club
  type: http
  seq: 4

http:
  method: PUT
  url: "{{LOCAL_ADMIN_URL}}clubs/update/5"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "name": "Royal Club Elite",
        "description": "Updated club for top performers.",
        "status": "ACTIVE",
        "rules": [
          {
            "metricId": 1,
            "operator": "GREATER_THAN_EQUAL",
            "targetValue": 2000,
            "sequence": 1,
            "isRequired": true
          },
          {
            "metricId": 4,
            "operator": "GREATER_THAN_EQUAL",
            "targetValue": 10,
            "sequence": 2,
            "isRequired": true
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
