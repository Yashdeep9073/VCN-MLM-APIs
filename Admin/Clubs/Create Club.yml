info:
  name: Create Club
  type: http
  seq: 3

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}clubs/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "name": "Royal Club June 2026",
        "description": "Users who achieve 5000 BV and sponsor 5 active members during June 2026.",
        "startDate": "2026-06-01T00:00:00.000Z",
        "endDate": "2026-06-30T23:59:59.999Z",
        "clubType": "ROYAL_CLUB",
        "status": "ACTIVE",
        "rules": [
          {
            "ruleType": "BV",
            "operator": "GREATER_THAN_EQUAL",
            "targetValue": 5000
          },
          {
            "ruleType": "DIRECT_SPONSORS",
            "operator": "GREATER_THAN_EQUAL",
            "targetValue": 5
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
