info:
  name: Create Club
  type: http
  seq: 3

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}clubs/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "name": "Royal Club 2026",
        "description": "Royal Club qualification for top achievers.",
        "startDate": "2026-01-01T00:00:00.000Z",
        "endDate": "2026-12-31T23:59:59.999Z",
        "clubType": "ROYAL_CLUB",
        "status": "DRAFT",
        "rules": [
          {
            "metricId": 1,
            "operator": "GREATER_THAN_EQUAL",
            "targetValue": 1000,
            "sequence": 1,
            "isRequired": true
          },
          {
            "metricId": 2,
            "operator": "GREATER_THAN_EQUAL",
            "targetValue": 5,
            "sequence": 2,
            "isRequired": true
          },
          {
            "metricId": 3,
            "operator": "GREATER_THAN",
            "targetValue": 50000,
            "sequence": 3,
            "isRequired": false
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
