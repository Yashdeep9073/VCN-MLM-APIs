info:
  name: Verify Payout Preference
  type: http
  seq: 2

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}payout-preferences/verify"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: "{\r

      \    \"payoutPreferenceId\":1\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
