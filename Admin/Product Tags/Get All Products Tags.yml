info:
  name: Get All Products Tags
  type: http
  seq: 3

http:
  method: GET
  url: "{{LOCAL_ADMIN_URL}}product-tags/read"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: text
    data: "{\r

      \    \"productId\": 1,\r

      \    \"tagIds\":[1,2,3]\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
