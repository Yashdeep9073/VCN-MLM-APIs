info:
  name: Create Product Tag
  type: http
  seq: 1

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}product-tags/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: "{\r

      \    \"productId\": 1,\r

      \    \"tagId\":1\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
