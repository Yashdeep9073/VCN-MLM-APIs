info:
  name: Create Senior Advisor Metric Definitions
  type: http
  seq: 3

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}senior-advisor-metric-definitions/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "code": "MONTHLY_SALES",
        "name": "Monthly Sales",
        "description": "Tracks the total monthly sales achieved by an advisor.",
        "dataType": "DECIMAL",
        "unit": "INR",
        "isActive": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
