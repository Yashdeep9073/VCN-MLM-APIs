info:
  name: Update Lead Followups
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{LOCAL_ADMIN_URL}}lead-follow-ups/update/1"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "type": "CALL",
        "outcome": "INTERESTED",
        "note": "Customer showed interest in the premium membership plan and requested a detailed quotation.",
        "followUpDate": "2026-07-14T10:30:00.000Z",
        "nextFollowDate": "2026-07-21T10:30:00.000Z"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
