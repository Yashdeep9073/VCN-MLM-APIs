info:
  name: Create Rank Reward
  type: http
  seq: 3

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}rank-rewards/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: "{\r

      \  \"rankId\": 1,\r

      \  \"rewardType\": \"LOYALTY_POINTS\",\r

      \  \"title\": \"10000 Loyalty Points\",\r

      \  \"amount\": 10000,\r

      \  \"walletCode\": \"LOYALTY\",\r

      \  \"metadata\": {\r

      \    \"source\": \"rank-achievement\"\r

      \  },\r

      \  \"isActive\": true\r

      }\r

      \r\n"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
