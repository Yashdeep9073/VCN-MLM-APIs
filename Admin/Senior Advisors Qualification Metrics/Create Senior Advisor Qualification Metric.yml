info:
  name: Create Senior Advisor Qualification Metric
  type: http
  seq: 3

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}senior-advisor-qualification-metrics/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "qualificationId": 3,
        "metricId": 4,
        "value": 100
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
