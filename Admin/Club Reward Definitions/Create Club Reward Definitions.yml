info:
  name: Create Club Reward Definitions
  type: http
  seq: 3

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}club-reward-definitions/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "clubId": 1,
        "name": "Royal Club Reward",
        "priority": 1,
        "isActive": true,
        "effectiveFrom": "2026-01-01T00:00:00.000Z",
        "effectiveTo": "2026-12-31T23:59:59.999Z"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
