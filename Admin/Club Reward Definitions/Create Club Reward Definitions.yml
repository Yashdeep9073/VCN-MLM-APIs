info:
  name: Create Club Reward Definitions
  type: http
  seq: 3

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}club-reward-definitions/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "clubId": 1,
        "scheduleId": 3,
        "name": "Silver Club Bonus",
        "description": "Monthly bonus for Silver Club members",
        "periodType": "MONTHLY",
        "customDays": null,
        "priority": 1,
        "effectiveFrom": "2026-07-01T00:00:00.000Z",
        "effectiveTo": null,
        "requiresQualification": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
