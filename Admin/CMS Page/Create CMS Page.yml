info:
  name: Create CMS Page
  type: http
  seq: 1

http:
  method: POST
  url: "{{SERVER_ADMIN_URL}}cms-pages/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "title": "About Us",
        "slug": "about-u",
        "description": "This is the about page of the website",
        "pageType": "ABOUT",
      //   "seoId": 1,
        "isHomePage": false,
        "isActive": true,
        "productId":1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
