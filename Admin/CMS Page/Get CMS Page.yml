info:
  name: Get CMS Page
  type: http
  seq: 2

http:
  method: GET
  url: "{{LOCAL_ADMIN_URL}}cms-pages/read?pageType=HOME"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: pageType
      value: HOME
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
