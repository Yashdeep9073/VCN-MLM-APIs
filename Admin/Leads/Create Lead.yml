  url: "{{LOCAL_ADMIN_URL}}leads"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: "{\r

      \            \"id\": 1,\r

      \            \"name\": \"demo lead\",\r

      \            \"phone\": \"6270482540\",\r

      \            \"email\": \"demo@gmail.com\",\r

      \            \"source\": \"FB\",\r

      \            \"status\": \"NEW\",\r

      \            \"assignedTo\": null\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
