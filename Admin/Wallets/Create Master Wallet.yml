info:
  name: Create Master Wallet
  type: http
  seq: 3

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}wallet/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
          "name": "Royal Club Wallet",
          "code": "ROYALITY_CLUB",
          "eligibilityType": "ROYALITY_CLUB_ONLY",
          "currency": "INR",
          "unitType": "POINTS"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
