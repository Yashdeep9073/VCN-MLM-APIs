info:
  name: Wallet Transactions
  type: http
  seq: 8

http:
  method: GET
  url: "{{LOCAL_ADMIN_URL}}wallet/read/wallet-transactions?walletCode=COMMISSION&type=&status=COMPLETED"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: walletCode
      value: COMMISSION
      type: query
    - name: type
      value: ""
      type: query
    - name: status
      value: COMPLETED
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
