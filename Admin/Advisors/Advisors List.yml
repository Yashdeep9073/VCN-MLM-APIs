info:
  name: Advisors List
  type: http
  seq: 1

http:
  method: GET
  url: "{{LOCAL_ADMIN_URL}}advisors/read?page=5&limit=2"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: page
      value: "5"
      type: query
    - name: limit
      value: "2"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
