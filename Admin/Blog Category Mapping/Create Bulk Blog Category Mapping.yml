info:
  name: Create Bulk Blog Category Mapping
  type: http
  seq: 5

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}blog-category-mapping/create/bulk"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |
      {
        "blogId":3 ,
        "categoryIds":[2,3,4]
        
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
