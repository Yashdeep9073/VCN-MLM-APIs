info:
  name: Update Placement Settings
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{LOCAL_ADMIN_URL}}placement-setting/update"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: "{\r

      \    \"id\": 1,\r

      \    \"isAutoPlacement\": false,\r

      \    \"defaultPreference\": \"HOLDING_TANK\",\r

      \    \"maxDepth\": 5000\r

      }\r\n"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
