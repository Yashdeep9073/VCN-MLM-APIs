info:
  name: Create Promotion  Rewards
  type: http
  seq: 3

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}promotion-reward/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "promotionId": 1,
        "rewardType": "FREE_PRODUCT",
        "value": 1,
        "productId": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
