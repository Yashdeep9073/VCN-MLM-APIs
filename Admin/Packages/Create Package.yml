info:
  name: Create Package
  type: http
  seq: 1

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}packages/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: "{\r

      \  \"name\": \"Regular Starter Pack\",\r

      \  \"sku\": \"PKG-REG-10BV\",\r

      \  \"price\": 799.00,\r

      \  \"description\": \"Standard 10BV entry-level pack with essential products.\",\r

      \  \"isSuperSaver\": false,\r

      \  \"isRegularPack\": true,\r

      \  \"isActive\": true,\r

      \  \"items\": [\r

      \    {\r

      \      \"productId\": 1,\r

      \      \"quantity\": 1\r

      \    },\r

      \    {\r

      \      \"productId\": 2,\r

      \      \"quantity\": 2\r

      \    }\r

      \  ]\r

      }\r\n"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
