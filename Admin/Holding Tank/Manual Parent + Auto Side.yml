info:
  name: Manual Parent + Auto Side
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{LOCAL_ADMIN_URL}}holding-tank/update/place"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: "{\r

      \    \"holdingId\": 1,\r

      \    \"userId\": 2,\r

      \    \"placement\": {\r

      \        \"nodeId\": 10\r

      \    },\r

      \    \"forcedPlacement\": true\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
