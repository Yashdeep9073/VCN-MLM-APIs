info:
  name: Create Club Reward Records Items
  type: http
  seq: 3

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}club-reward-record-items/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "recordId": 1,
        "componentId": 2,
        "walletId": 1,
        "incomeType": "CASH",
        "amount": 2500.75,
        "remarks": "Cash reward credited for Royal Club."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
