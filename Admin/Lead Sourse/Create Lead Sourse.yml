info:
  name: Create Lead Sourse
  type: http
  seq: 1

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}lead-sources/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "name": "Facebook Ads",
        "type": "FACEBOOK",
        "isActive": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
