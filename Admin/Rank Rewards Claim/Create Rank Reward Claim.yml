info:
  name: Create Rank Reward Claim
  type: http
  seq: 3

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}rank-rewards-claim/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: "{\r

      \  \"userId\": 2,\r

      \  \"rankRewardId\": 1,\r

      \  \"status\": \"APPROVED\",\r

      \  \"remarks\": \"Eligible for reward\"\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
