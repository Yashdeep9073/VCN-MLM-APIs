info:
  name: Update Promotion Condition
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{LOCAL_ADMIN_URL}}promotion-condition/update"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "id":1,
        "promotionId": 1,
        "minimumQty": 3,
        "minimumAmount": 1500,
        "maximumDiscount": 300,
        "customerType": "CUSTOMER"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
