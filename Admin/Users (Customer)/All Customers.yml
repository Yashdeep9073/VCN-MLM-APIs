info:
  name: All Customers
  type: http
  seq: 10

http:
  method: GET
  url: "{{LOCAL_ADMIN_URL}}users/customer/read?limit=1&page=16"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: limit
      value: "1"
      type: query
    - name: page
      value: "16"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
