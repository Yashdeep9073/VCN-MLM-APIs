info:
  name: "Create Voucher "
  type: http
  seq: 3

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}voucher/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "campaignId": "1",
        "code": "SUMMER2026",
        "amount": 500,
        "expiryDate": "2026-12-31T23:59:59.000Z",
        "maxUsage": 100,
        "isActive": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
