info:
  name: Create Spilling Preference
  type: http
  seq: 3

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}spilling-preference/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: "{\r

      \  \"userId\": 0,\r

      \  \"preference\": \"AUTO_BALANCE\"\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
