info:
  name: Update Spilling Preference
  type: http
  seq: 4

http:
  method: PUT
  url: "{{LOCAL_ADMIN_URL}}spilling-preference/update"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: "{\r

      \  \"id\": 1,\r

      \  \"userId\": 1,\r

      \  \"preference\": \"AUTO_BALANCE\"\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
