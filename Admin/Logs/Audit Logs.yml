info:
  name: Audit Logs
  type: http
  seq: 1

http:
  method: GET
  url: "{{LOCAL_ADMIN_URL}}logs/read/audit?limit=1"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: limit
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
