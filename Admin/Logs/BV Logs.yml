info:
  name: BV Logs
  type: http
  seq: 2

http:
  method: GET
  url: "{{LOCAL_ADMIN_URL}}logs/read/bv?limit=2"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: limit
      value: "2"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
