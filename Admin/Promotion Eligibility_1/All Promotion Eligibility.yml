info:
  name: All Promotion Eligibility
  type: http
  seq: 1

http:
  method: GET
  url: "{{LOCAL_ADMIN_URL}}promotion-eligibility/read?limit=10"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: limit
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
