info:
  name: Create Promotion  Product
  type: http
  seq: 3

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}promotion-product/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "promotionId": 1,
        "productId": 1,
        "quantity": 5,
        "isReward": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
