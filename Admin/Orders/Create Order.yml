info:
  name: Create Order
  type: http
  seq: 1

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}orders/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "customerId": 1,
        "items": [
          { "variantId": 1, "quantity": 1 }
      //     { "variantId": 2, "quantity": 1 }
        ],
        "buyerType": "PREFERRED_CUSTOMER",
        "paymentMode": "ONLINE"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
