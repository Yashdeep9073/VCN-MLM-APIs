info:
  name: Create Club Reward Components
  type: http
  seq: 3

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}club-reward-components/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "rewardDefinitionId": 1,
        "walletId": 1,
        "calculationType": "FIXED",
        "fixedAmount": 1000
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
