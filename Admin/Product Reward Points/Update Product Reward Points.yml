info:
  name: Update Product Reward Points
  type: http
  seq: 3

http:
  method: PUT
  url: "{{LOCAL_ADMIN_URL}}product-reward-pointes/update"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: "{\r

      \    \"id\": 1,\r

      \    \"productVariantId\": 1,\r

      \    \"bv\": 15,\r

      \    \"lpPercentage\": 10.00\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
