info:
  name: Create Advisor Rule
  type: http
  seq: 3

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}advisor-rules/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "name": "Bronze Advisor",
        "minPersonalBV": 1000,
        "minPairBV": 5000
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
