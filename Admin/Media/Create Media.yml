info:
  name: Create Media
  type: http
  seq: 1

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}media/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: multipart-form
    data:
      - name: title
        type: text
        value: CV
      - name: folder
        type: text
        value: DOCUMENT
      - name: altText
        type: text
        value: asdaksnk
      - name: file
        type: file
        value:
          - C:\Users\Mayankgoyal\Downloads\fasohf Report.pdf
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
