info:
  name: Get All Media
  type: http
  seq: 2

http:
  method: GET
  url: "{{LOCAL_ADMIN_URL}}media/read?page=1&limit=21"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "21"
      type: query
    - name: mimeType
      value: ""
      type: query
      disabled: true
    - name: folder
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
