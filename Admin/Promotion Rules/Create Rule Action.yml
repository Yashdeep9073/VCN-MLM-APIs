info:
  name: Create Rule Action
  type: http
  seq: 7

http:
  method: POST
  url: "{{SERVER_ADMIN_URL}}promotion-rule/create/actions"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: "{\r

      \    \"ruleId\": 1,\r

      \    \"actions\": [\r

      \        {\r

      \            \"type\": \"PAYOUT_ACTIVATION\",\r

      \            \"config\": {\r

      \                \"enabled\": false\r

      \            }\r

      \        }\r

      \    \r

      \    ]\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
