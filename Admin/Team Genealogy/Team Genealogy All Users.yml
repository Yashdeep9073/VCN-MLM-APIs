info:
  name: Team Genealogy All Users
  type: http
  seq: 2

http:
  method: GET
  url: "{{LOCAL_ADMIN_URL}}team-genealogy/read?limit=10&offset=0"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: limit
      value: "10"
      type: query
    - name: offset
      value: "0"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
