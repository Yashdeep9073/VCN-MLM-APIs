info:
  name: Update Club Metric Definition
  type: http
  seq: 4

http:
  method: PUT
  url: "{{LOCAL_ADMIN_URL}}club-metric-definitions/update/2"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "code": "BV",
        "name": "Business Volume",
        "description": "Total business volume generated by a member during the qualification period.",
        "dataType": "DECIMAL",
        "unit": "Points",
        "isActive": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
