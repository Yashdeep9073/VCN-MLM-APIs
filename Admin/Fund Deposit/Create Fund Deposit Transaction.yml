info:
  name: Create Fund Deposit Transaction
  type: http
  seq: 1

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}fund-deposit/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: "{\r

      \  \"userId\": 123,\r

      \  \"walletId\": 2,\r

      \  \"amount\": 5000,\r

      \  \"reason\": \"Manual bonus credit for June performance\"\r

      }\r\n"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
