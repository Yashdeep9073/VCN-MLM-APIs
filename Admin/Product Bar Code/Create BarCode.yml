      value: "{{TOKEN}}"
  body:
    type: json
    data: "{\r

      \    \"productVariantId\":2,\r

      \    \"type\": \"CODE128\"\r

      \r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
