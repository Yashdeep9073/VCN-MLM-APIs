info:
  name: Create Senior Advisor  Income Components
  type: http
  seq: 3

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}senior-advisor-income-components/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "definitionId": 1,
        "walletId": 2,
        "calculationType": "FIXED",
        "fixedAmount": 1000,
        "percentage": null,
        "formula": null
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
