info:
  name: Get All Snapshots
  type: http
  seq: 2

http:
  method: GET
  url: "{{LOCAL_ADMIN_URL}}snapshots/read"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |
      // Request
      {
          "snapshotType": "BINARY",
          "filters": {
              "userId": "1232324323"
          }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
