info:
  name: Product Variants
  type: http
  seq: 3

http:
  method: GET
  url: "{{LOCAL_ADMIN_URL}}product-variant/read?limit=2"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: limit
      value: "2"
      type: query
  body:
    type: text
    data: "{\r

      \  \"sku\": \"SKU-ABC12345\",\r

      \  \"mrp\": 500,\r

      \  \"sellingPrice\": 420,\r

      \  \"distributorPrice\": 350,\r

      \  \"weight\": 100,\r

      \  \"unitId\": 1,\r

      \  \"isDefault\": true\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
