info:
  name: Create Course Category
  type: http
  seq: 3

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}lms/course-categories/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "name": "Basic Membership",
        "description": "Basic membership plan",
        "isActive": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
