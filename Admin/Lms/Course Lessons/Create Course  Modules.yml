info:
  name: Create Course  Modules
  type: http
  seq: 3

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}lms/lessons/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "moduleId": 1,
        "title": "Introduction to JavaScript",
        "type": "LECTURE",
        "duration": 45,
        "content": "In this lesson, we will learn the basics of JavaScript.",
        "videoUrl": "https://example.com/videos/javascript-intro.mp4",
        "attachmentUrl": "https://example.com/files/javascript-notes.pdf",
        "sortOrder": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
