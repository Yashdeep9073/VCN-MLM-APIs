info:
  name: Create Course  Modules
  type: http
  seq: 3

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}lms/course-modules/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "courseId": 1,
        "title": "Introduction to JavaScript",
        "sortOrder": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
