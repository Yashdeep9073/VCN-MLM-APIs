info:
  name: Create Course  Quizzes
  type: http
  seq: 3

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}lms/quizzes/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "lessonId": 1,
        "title": "JavaScript Basics Quiz",
        "passingMarks": 60,
        "timeLimit": 30,
        "randomQuestions": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
