info:
  name: All Users
  type: http
  seq: 1

http:
  method: GET
  url: "{{LOCAL_ADMIN_URL}}referral-downline/read?page=1&limit=5"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "5"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
