info:
  name: Create Inventory Batch
  type: http
  seq: 3

http:
  method: POST
  url: "{{LOCAL_ADMIN_URL}}inventory-batch/create"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "productVariantId": 1,
        "warehouseId": 1,
        "batchNo": "BATCH-2026-001",
        "quantity": 100,
        "costPrice": 499.99,
        "expiryDate": "2027-12-31T00:00:00.000Z"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
