    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "id": 1,
        "code": "SOH001-UPDATED",
        "name": "Chandigarh SOH Updated",
        "level": "SOH",
        "ownerId": 2,
        "warehouseId": 2,
      //   "parentCentreId": 4,
        "status": "ACTIVE",
        "addressId": 6,
        "minimumInvestment": 750000,
        "pincodes": [
